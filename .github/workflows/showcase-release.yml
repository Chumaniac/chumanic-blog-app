name: Verified reading release
on:
  push:
    tags: ["showcase-*"]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require verified main and a new immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^showcase-[0-9]{4}[.][0-9]{2}[.][0-9]{2}(-[0-9]+)?$ ]]
          refs=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}")
          source=$(printf '%s\n' "$refs" | awk '/\^\{\}$/ {print $1;exit}')
          [[ -n "$source" ]] || source=$(printf '%s\n' "$refs" | awk 'NR==1 {print $1}')
          test "$source" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success&per_page=1" > "$RUNNER_TEMP/source-ci.json"
          node --input-type=module - "$RUNNER_TEMP/source-ci.json" <<'JS'
          import fs from 'node:fs';
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8')).workflow_runs;
          if(!rows.some(r=>r.head_sha===process.env.GITHUB_SHA&&r.head_branch==='main'&&r.conclusion==='success'))process.exit(1);
          JS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Existing releases are immutable' >&2; exit 1; fi
      - run: node --test tests/reading-profile.test.mjs
      - name: Package only the reading sample and its license
        run: |
          set -euo pipefail
          mkdir release
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib,zipfile
          expected={'index.html','journal.js','journal.css','journal.svg'}
          root=Path('site');files=list(root.iterdir())
          assert {p.name for p in files}==expected
          assert all(p.is_file() and not p.is_symlink() and p.stat().st_size<=64*1024 for p in files)
          assert sum(p.stat().st_size for p in files)<=256*1024
          payload={p.name:p.read_bytes() for p in files}
          license=Path('LICENSE');assert license.is_file() and not license.is_symlink() and license.stat().st_size<=1024**2
          payload['LICENSE']=license.read_bytes()
          payload['RUN.md']='# Journal 阅读样例\n\n在此目录运行 python3 -m http.server 8000 --bind 127.0.0.1，再打开 http://127.0.0.1:8000/。支持选文、排版、手动保存篇目与 JSON 设置迁移。导入先应用当前页，检查后分别保存。只含三个公开短文和本机偏好，不含私人 Reader、文章编辑、CMS 或模型。\n'.encode()
          archive=Path('release/journal-reading-browser.zip')
          with zipfile.ZipFile(archive,'x',compression=zipfile.ZIP_DEFLATED) as bundle:
              for name,data in sorted(payload.items()):
                  info=zipfile.ZipInfo('journal-reading-browser/'+name,(2020,1,1,0,0,0));info.external_attr=0o100644<<16;info.compress_type=zipfile.ZIP_DEFLATED;bundle.writestr(info,data)
          Path('release/source-manifest.json').write_text(json.dumps({'schema':'journal.reading-browser-release/v1','sourceCommit':os.environ['GITHUB_SHA'],'tag':os.environ['GITHUB_REF_NAME'],'artifact':archive.name,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'files':{n:hashlib.sha256(v).hexdigest() for n,v in sorted(payload.items())},'mode':'public sample articles and local reading preferences; no private editorial tool, Reader service or model'},indent=2)+'\n')
          PY
          (cd release && sha256sum *.zip *.json > checksums.txt)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release/*.zip
      - name: Publish while preserving desktop Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Existing releases are immutable' >&2; exit 1; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --title "Journal · 阅读样例 $GITHUB_REF_NAME" --notes '目录检索、阅读排版、篇目保存及篇目/排版JSON迁移。导入先应用当前页，取消/超时/新操作会丢弃晚到文件；脚本未就绪仍能读首篇。解压后用python3 -m http.server打开，包内无私人Reader、CMS或编辑后端。保留原桌面Latest，附准确源码身份、校验和与构建来源证明。' release/*
